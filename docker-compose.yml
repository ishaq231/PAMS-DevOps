# Runs the API and the web frontend together with one command.
#
#   docker compose up --build
#
# API   → http://localhost:8000  (and /docs for Swagger)
# Web   → http://localhost:5173
#
# The frontend talks to the API from the *browser*, not container-to-container,
# so VITE_API_URL points at localhost:8000 as the user's machine sees it —
# not at the compose service name.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time, not runtime — Vite compiles this into the bundle.
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
