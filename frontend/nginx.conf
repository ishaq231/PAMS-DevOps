server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # React Router handles routing in the browser, so /tenants and /invoices
    # don't exist as files on disk. Without this fallback, refreshing the page
    # on any route other than / returns a 404 from nginx before React ever
    # loads. try_files serves index.html for anything that isn't a real file,
    # and React then reads the URL and renders the right screen.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints build output (app-a1b2c3.js), so those filenames change
    # whenever the content does and can safely be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached, or browsers keep loading an old version
    # that references asset files no longer on the server.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
